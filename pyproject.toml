[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "downloadkit"
version = "0.3.0"
description = "Multi-platform resource downloader for music, Douyin, Bilibili, YouTube, Xiaohongshu and more"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "pycryptodome>=3.20",
    "yt-dlp>=2024.0",
    "browser_cookie3>=0.19.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
]

[project.scripts]
downloadkit = "downloadkit.cli:main"

[project.optional-dependencies]
media = [
    "Pillow>=10.0",
    "moviepy>=1.0",
]
browser = [
    "playwright>=1.40",
]
douyin = [
    "biliup>=0.4.0",
    "PyExecJS>=1.5.1",
    "gmssl>=3.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
downloadkit = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=_vendor"
