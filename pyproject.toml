[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "downloadkit"
version = "0.6.0"
description = "Multi-platform resource downloader for music, Douyin, Bilibili, YouTube, Xiaohongshu and more"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "httpx>=0.27",
    "pycryptodome>=3.20",
    "yt-dlp>=2024.0",
    "browser_cookie3>=0.19.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pydantic>=2.0",
    "mutagen>=1.47",
]

[project.scripts]
downloadkit = "downloadkit.cli:main"

[project.optional-dependencies]
media = [
    "Pillow>=10.0",
    "moviepy>=1.0",
]
browser = [
    "playwright>=1.40",
]
desktop = [
    "pywebview>=5.0",
    # 托盘图标（关闭到托盘 / 后台常驻）。pystray 在 Windows 上会走
    # Pillow 渲染图标，所以两个一起声明，单装 desktop 这个 extra 就能用。
    "pystray>=0.19",
    "Pillow>=10.0",
]
douyin = [
    "playwright>=1.40",
    "PyExecJS>=1.5.1",
    "gmssl>=3.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
downloadkit = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=_vendor"
asyncio_mode = "auto"
