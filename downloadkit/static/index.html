<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>DownloadKit</title>
<script src="vendor/lucide.min.js"></script>
<link rel="stylesheet" href="css/main.css?v=20260604b">
</head>
<body>

<div class="app">
  <!-- 侧边栏遮罩 (移动端) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  
  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i data-lucide="download" class="logo-icon"></i>
        <span>DownloadKit</span>
      </div>
    </div>
    
    <nav class="sidebar-nav">
      <div class="nav-section">
        <div class="nav-label">功能</div>
        <a class="nav-item active" data-tab="music">
          <i data-lucide="music" class="nav-icon"></i>
          <span>音乐下载</span>
        </a>
        <a class="nav-item" data-tab="resource">
          <i data-lucide="link" class="nav-icon"></i>
          <span>资源解析</span>
        </a>
      </div>
      
      <div class="nav-section">
        <div class="nav-label">管理</div>
        <a class="nav-item" data-tab="files">
          <i data-lucide="folder" class="nav-icon"></i>
          <span>已下载</span>
        </a>
        <a class="nav-item" data-tab="queue">
          <i data-lucide="download" class="nav-icon"></i>
          <span>下载队列</span>
        </a>
        <a class="nav-item" data-tab="settings">
          <i data-lucide="settings" class="nav-icon"></i>
          <span>设置</span>
        </a>
      </div>
    </nav>
  </aside>

  <!-- 主内容区 -->
  <main class="main">
    <!-- 工具栏 -->
    <header class="toolbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-btn" id="menu-btn"><i data-lucide="menu"></i></button>
        <h1 class="page-title" id="page-title">音乐下载</h1>
      </div>
      <div class="toolbar-actions" id="toolbar-actions"></div>
    </header>

    <!-- 内容区 -->
    <div class="content">
      <!-- 音乐下载面板 -->
      <div class="tab-panel active" id="panel-music">
        <div class="search-section">
          <div class="search-box">
            <i data-lucide="search" class="search-icon"></i>
            <input class="search-input" id="music-input" type="text" placeholder="搜索歌曲、歌手、专辑，或粘贴歌单链接..." autocomplete="off">
            <button class="search-clear" id="music-clear" title="清空"><i data-lucide="x"></i></button>
            <button class="search-btn" id="music-btn" title="搜索"><i data-lucide="arrow-right"></i></button>
          </div>
        </div>

        <div id="music-status" class="status-msg" style="display:none"></div>
        <div class="results-grid" id="music-results"></div>
        
        <!-- 歌单预览 -->
        <div class="playlist-preview" id="playlist-preview">
          <div class="pl-header">
            <div class="pl-name" id="pl-name"></div>
            <div class="pl-meta" id="pl-meta"></div>
          </div>
          <div class="pl-songs" id="pl-songs"></div>
          <div class="pl-actions">
            <button class="btn btn-primary" id="pl-download-all">全部下载</button>
            <button class="btn btn-secondary" id="pl-clear">关闭预览</button>
          </div>
        </div>
        
        <div class="bulk-bar" id="bulk-bar">
          <span class="bulk-count" id="bulk-count">已选 0 首</span>
          <div class="bulk-actions">
            <button class="btn btn-primary" id="bulk-download">下载选中</button>
            <button class="btn btn-secondary" id="bulk-clear">取消选择</button>
          </div>
        </div>
      </div>

      <!-- 资源解析面板 -->
      <div class="tab-panel" id="panel-resource">
        <!-- 模式切换 -->
        <div class="resource-mode-toggle">
          <button class="mode-btn active" data-mode="single">单个链接</button>
          <button class="mode-btn" data-mode="batch">批量下载</button>
        </div>
        
        <!-- 单个链接模式 -->
        <div class="single-mode" id="single-mode">
          <div class="search-section">
            <div class="search-box">
              <i data-lucide="link" class="search-icon"></i>
              <input class="search-input" id="resource-input" type="text" placeholder="粘贴视频/图文链接，支持抖音、B站、YouTube、小红书..." autocomplete="off">
              <button class="search-clear" id="resource-clear" title="清空"><i data-lucide="x"></i></button>
              <button class="search-btn" id="resource-btn" title="解析"><i data-lucide="arrow-right"></i></button>
            </div>
            <div class="resource-hint">支持多个链接，每行一个，自动批量解析</div>
          </div>
          
          <div id="resource-status" class="status-msg" style="display:none"></div>
          <div id="resource-preview" style="display:none"></div>
        </div>
        
        <!-- 批量模式 -->
        <div class="batch-mode" id="batch-mode" style="display:none">
          <div class="batch-input-section">
            <textarea class="batch-textarea" id="batch-input" placeholder="粘贴多个链接，每行一个&#10;支持抖音、B站、YouTube、小红书...&#10;&#10;示例:&#10;https://www.bilibili.com/video/BV1xx...&#10;https://www.youtube.com/watch?v=xxx&#10;https://v.douyin.com/xxx"></textarea>
            <div class="batch-actions">
              <button class="btn btn-primary" id="batch-parse-btn"><i data-lucide="search" style="width:14px;height:14px;margin-right:6px"></i>解析全部</button>
              <button class="btn btn-secondary" id="batch-clear-btn">清空</button>
            </div>
          </div>
          
          <div id="batch-status" class="status-msg" style="display:none"></div>
          <div id="batch-results" style="display:none"></div>
        </div>
      </div>

      <!-- 已下载面板 -->
      <div class="tab-panel" id="panel-files">
        <div class="files-toolbar">
          <div class="files-select-all">
            <input type="checkbox" id="select-all">
            <label for="select-all">全选</label>
          </div>
          <div class="files-actions">
            <button class="btn btn-secondary" id="files-delete-selected" disabled>
              <i data-lucide="trash-2"></i> 删除选中
            </button>
            <button class="btn btn-secondary" id="files-open-dir">
              <i data-lucide="folder-open"></i> 打开目录
            </button>
          </div>
        </div>
        
        <div id="files-status" class="status-msg" style="display:none"></div>
        <div class="files-list" id="files-list"></div>
        <div class="empty-state" id="files-empty">
          <div class="empty-icon"><i data-lucide="folder-open"></i></div>
          <div class="empty-title">暂无下载文件</div>
          <div class="empty-text">去搜索并下载一些内容吧</div>
        </div>
      </div>
      
      <!-- 下载队列面板 -->
      <div class="tab-panel" id="panel-queue">
        <div class="queue-header">
          <div class="queue-stats">
            <span id="queue-downloading">0</span> 下载中 · 
            <span id="queue-pending">0</span> 等待中 · 
            <span id="queue-completed">0</span> 已完成
          </div>
          <button class="btn btn-secondary" id="queue-refresh">
            <i data-lucide="refresh-cw" style="width:14px;height:14px;margin-right:6px"></i>刷新
          </button>
        </div>
        
        <div id="queue-status" class="status-msg" style="display:none"></div>
        <div class="queue-list" id="queue-list"></div>
        <div class="empty-state" id="queue-empty">
          <div class="empty-icon"><i data-lucide="download"></i></div>
          <div class="empty-title">下载队列为空</div>
          <div class="empty-text">添加下载任务后将在这里显示</div>
        </div>
    </div>

      <!-- 设置面板 -->
      <div class="tab-panel" id="panel-settings">
        <div class="search-section">
          <h3 style="margin-bottom:16px;font-weight:600">应用设置</h3>
          
          <div style="max-width:500px">
            <div style="margin-bottom:16px;padding-top:0">
              <h4 style="margin-bottom:12px;font-weight:500;font-size:14px">下载目录</h4>
              
              <div style="margin-bottom:10px">
                <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--text-secondary)">基础下载目录 <span style="font-size:11px;color:var(--success);margin-left:8px">立即生效</span></label>
                <div style="display:flex;gap:6px">
                  <input class="search-input" id="setting-download-dir" type="text" placeholder="./downloads" style="flex:1">
                  <button class="btn btn-secondary" id="setting-browse-dir" style="padding:4px 10px;font-size:12px;white-space:nowrap">选择目录</button>
                </div>
              </div>
              
              <div style="margin-bottom:10px">
                <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--text-secondary)">音乐下载目录</label>
                <div style="display:flex;gap:6px">
                  <input class="search-input" id="setting-download-dir-music" type="text" placeholder="" style="flex:1">
                  <button class="btn btn-secondary" id="setting-browse-dir-music" style="padding:4px 10px;font-size:12px;white-space:nowrap">选择目录</button>
                </div>
              </div>
              
              <div style="margin-bottom:10px">
                <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--text-secondary)">视频下载目录</label>
                <div style="display:flex;gap:6px">
                  <input class="search-input" id="setting-download-dir-video" type="text" placeholder="" style="flex:1">
                  <button class="btn btn-secondary" id="setting-browse-dir-video" style="padding:4px 10px;font-size:12px;white-space:nowrap">选择目录</button>
                </div>
              </div>
              
              <div style="margin-bottom:10px">
                <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--text-secondary)">实况照片目录</label>
                <div style="display:flex;gap:6px">
                  <input class="search-input" id="setting-download-dir-animated" type="text" placeholder="" style="flex:1">
                  <button class="btn btn-secondary" id="setting-browse-dir-animated" style="padding:4px 10px;font-size:12px;white-space:nowrap">选择目录</button>
                </div>
              </div>
              
              <div style="margin-bottom:0">
                <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--text-secondary)">图片下载目录</label>
                <div style="display:flex;gap:6px">
                  <input class="search-input" id="setting-download-dir-images" type="text" placeholder="" style="flex:1">
                  <button class="btn btn-secondary" id="setting-browse-dir-images" style="padding:4px 10px;font-size:12px;white-space:nowrap">选择目录</button>
                </div>
              </div>
            </div>
            
            <div style="margin-bottom:16px">
              <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--text-secondary)">最大并发下载数 <span style="font-size:11px;color:var(--success);margin-left:8px">立即生效</span></label>
              <input class="search-input" id="setting-max-concurrent" type="number" min="1" max="10" value="3" style="width:100px">
            </div>
            
            <div style="margin-bottom:16px">
              <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--text-secondary)">日志级别 <span style="font-size:11px;color:var(--warning);margin-left:8px">需重启</span></label>
              <select class="search-input" id="setting-log-level" style="width:140px">
                <option value="DEBUG">DEBUG</option>
                <option value="INFO">INFO</option>
                <option value="WARNING">WARNING</option>
                <option value="ERROR">ERROR</option>
              </select>
            </div>
            
            <div style="margin-bottom:16px;padding-top:12px;border-top:1px solid var(--border)">
              <h4 style="margin-bottom:12px;font-weight:500;font-size:14px">代理设置</h4>
              
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
                <label style="font-size:13px;color:var(--text-secondary)">启用代理</label>
                <input type="checkbox" id="setting-proxy-enabled" style="width:18px;height:18px;cursor:pointer">
              </div>
              
              <div id="proxy-fields" style="display:flex;flex-direction:column;gap:8px">
                <div><input class="search-input" id="setting-proxy-global" type="text" placeholder="全局代理 (http://127.0.0.1:7890)" style="width:100%"></div>
                <div><input class="search-input" id="setting-proxy-youtube" type="text" placeholder="YouTube 代理" style="width:100%"></div>
                <div><input class="search-input" id="setting-proxy-douyin" type="text" placeholder="抖音 代理" style="width:100%"></div>
                <div><input class="search-input" id="setting-proxy-bilibili" type="text" placeholder="B站 代理" style="width:100%"></div>
                <div><input class="search-input" id="setting-proxy-xiaohongshu" type="text" placeholder="小红书 代理" style="width:100%"></div>
              </div>
            </div>
            
            <div style="margin-bottom:16px;padding-top:12px;border-top:1px solid var(--border)">
              <h4 style="margin-bottom:12px;font-weight:500;font-size:14px">Cookie 设置</h4>
              <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--text-secondary)">抖音 Cookie 文件路径 <span style="font-size:11px;color:var(--success);margin-left:8px">立即生效</span></label>
              <input class="search-input" id="setting-cookie-douyin" type="text" placeholder="~/.downloadkit/cookies/douyin.json" style="width:100%">
              <div style="margin-top:8px">
                <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--text-secondary)">B站 Cookie 文件路径 <span style="font-size:11px;color:var(--success);margin-left:8px">立即生效</span></label>
                <input class="search-input" id="setting-cookie-bilibili" type="text" placeholder="~/.downloadkit/cookies/bilibili.json" style="width:100%">
              </div>
            </div>
            
            <div style="margin-bottom:16px;padding-top:12px;border-top:1px solid var(--border)">
              <h4 style="margin-bottom:12px;font-weight:500;font-size:14px">下载设置</h4>
              
              <div style="margin-bottom:12px">
                <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--text-secondary)">文件重名策略 <span style="font-size:11px;color:var(--warning);margin-left:8px">需重启</span></label>
                <select class="search-input" id="setting-rename-strategy" style="width:160px">
                  <option value="skip">跳过</option>
                  <option value="rename">自动重命名</option>
                  <option value="overwrite">覆盖</option>
                </select>
              </div>
              
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
                <label style="font-size:13px;color:var(--text-secondary)">默认生成实况照片</label>
                <input type="checkbox" id="setting-motion-photo-default" style="width:18px;height:18px;cursor:pointer" checked>
              </div>
              
              <div style="margin-bottom:0">
                <label style="display:block;margin-bottom:4px;font-size:13px;color:var(--text-secondary)">历史记录最大保留条数 <span style="font-size:11px;color:var(--warning);margin-left:8px">需重启</span></label>
                <input class="search-input" id="setting-history-max-records" type="number" min="100" max="100000" value="1000" style="width:120px">
              </div>
            </div>
            
            <div style="display:flex;gap:8px;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)">
              <button class="btn btn-primary" id="settings-save"><i data-lucide="save" style="width:14px;height:14px;margin-right:6px"></i>保存</button>
              <button class="btn btn-secondary" id="settings-reset">恢复默认</button>
            </div>
          </div>
        </div>
      </div>



  </main>
</div>

<!-- Toast容器 -->
<div class="toast-container" id="toast-container"></div>

<script src="js/utils.js?v=20260604b"></script>
<script src="js/music.js?v=20260604b"></script>
<script src="js/resource.js?v=20260604b"></script>
<script src="js/files.js?v=20260604b"></script>
<script src="js/queue.js?v=20260604b"></script>
<script src="js/settings.js?v=20260617"></script>
<script src="js/app.js?v=20260604b"></script>
</body>
</html>
